name: Build Windows EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller open3d numpy pye57 laspy
      - run: pyinstaller --onefile --console --name "PointCloudProcessor" open3d_script.py
      - uses: actions/upload-artifact@v4
        with:
          name: PointCloudProcessor_Windows
          path: dist/PointCloudProcessor.exe
